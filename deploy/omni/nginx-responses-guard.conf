# http-context declarations required by the SSE guard location in nginx-site.conf.
# Install as /etc/nginx/conf.d/omniroute-responses-guard.conf (or include from http {})
# BEFORE running nginx -t: without these zones the site template fails to load with
# "unknown limit_req zone" / "unknown limit_conn zone".
limit_req_zone $binary_remote_addr zone=omni_responses_rate:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=omni_responses_conn:10m;
