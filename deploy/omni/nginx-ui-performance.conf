map $http_upgrade $omni_connection_upgrade {
    default upgrade;
    '' '';
}
upstream omni_dashboard_backend {
    server 127.0.0.1:20128;
    keepalive 32;
}
log_format omniroute_timing '$time_iso8601 method=$request_method uri=$uri status=$status rt=$request_time urt=$upstream_response_time sent=$bytes_sent';
