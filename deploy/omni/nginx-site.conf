server {
    server_name api.mafsolin.space;

    client_max_body_size 60m;

    # Keep immutable UI files available even when Node is doing DB work.
    access_log /var/log/nginx/omniroute-timing.log omniroute_timing;
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /_next/static/ {
        alias /var/www/omniroute-ui-static/current/;
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }


    # Codex Desktop calls the hosted web-search compatibility endpoint.
    location = /v1/alpha/search {
        proxy_pass http://127.0.0.1:20129;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /max-sonar/webhook {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /max-sonar/health {
        proxy_pass http://127.0.0.1:18083;
        proxy_set_header Host $host;
    }

    # Protect the single Node event loop from bursty/fan-out chat clients.
    # Health, dashboard, and WebSocket paths remain on the general location.
    location ~ ^/(?:api/)?v1/(responses|chat/completions)$ {
        limit_req zone=omni_responses_rate burst=4 nodelay;
        limit_conn omni_responses_conn 20;
        limit_conn_status 429;
        limit_req_status 429;
        proxy_buffering off;
        proxy_pass http://omni_dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $omni_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://omni_dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $omni_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.mafsolin.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.mafsolin.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    listen 80;
    listen [::]:80;
    server_name api.mafsolin.space;

    # проверка владения доменом (Let's Encrypt), добавлено вручную
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/api-acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
